<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1640" viewBox="0 0 2400 1640" role="img" aria-labelledby="title desc">
<title id="title">Resume Intelligence Portal: DA1 deployment, DA3 local experiment, and proposed cloud bursting</title>
<desc id="desc">Readable architecture diagram with separated DA1 and DA3 flows. Solid black indicates existing components and flows. Orange dashed indicates a proposed, unbuilt burst design.</desc>
<defs>
  <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#111111"/></marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#c65d00"/></marker>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#111}
    .section{font:700 23px Arial,sans-serif;fill:#111}
    .label{font:700 19px Arial,sans-serif;fill:#111}
    .text{font:16px Arial,sans-serif;fill:#111}
    .small{font:16px Arial,sans-serif;fill:#222}
    .small tspan:first-child{font:700 19px Arial,sans-serif;fill:#111}
    .note{font:italic 14px Arial,sans-serif;fill:#444}
    .box{fill:#fff;stroke:#111;stroke-width:2.2}
    .group{fill:#f8f8f8;stroke:#222;stroke-width:2;}
    .cloud{fill:#fff;stroke:#111;stroke-width:2.2}
    .tool{fill:#f0f0f0;stroke:#666;stroke-width:1.7}
    .flow{fill:none;stroke:#111;stroke-width:2.4;marker-end:url(#arrowBlack);stroke-linejoin:round;stroke-linecap:round}
    .proposal{fill:#fff8ef;stroke:#c65d00;stroke-width:3;stroke-dasharray:11 8}
    .proposalText{font:16px Arial,sans-serif;fill:#964600}
    .proposalLabel{font:700 19px Arial,sans-serif;fill:#964600}
    .proposalFlow{fill:none;stroke:#c65d00;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrowOrange);stroke-linejoin:round;stroke-linecap:round}
  </style>
</defs>
<rect width="2400" height="1640" fill="#fff"/>
<text x="1200" y="43" class="title" text-anchor="middle">Resume Intelligence Portal — DA1 deployment, DA3 experiment, and cloud-bursting proposal</text><rect x="35" y="70" width="2330" height="640" rx="18" class="group"/><rect x="35" y="735" width="1395" height="690" rx="18" class="group"/><rect x="1470" y="735" width="895" height="690" rx="18" class="proposal"/><rect x="35" y="1450" width="2330" height="150" rx="12" class="tool"/><text x="65" y="111" class="section" text-anchor="start">DA1 deployed architecture — owner-confirmed functional after Neon migration</text><text x="65" y="141" class="note" text-anchor="start">Live frontend API target and deployed API Neon branch are unknown. DA1 Cloud Run services are separate from the DA3 local stack.</text><text x="65" y="777" class="section" text-anchor="start">DA3 local Docker Compose experiment — not a Cloud Run performance measurement</text><text x="65" y="806" class="note" text-anchor="start">Apache Bench and the availability probe target local Nginx directly at http://localhost:8080; no frontend service is in this stack.</text><text x="1500" y="777" class="proposalLabel" text-anchor="start">Cloud-bursting extension — Proposed, not built</text><text x="1500" y="806" class="proposalText" text-anchor="start">Overflow routing is intended only; current Nginx has no max_conns or backup peer.</text><path d="M280 267 H365" class="flow"/><path d="M610 267 H700" class="flow"/><path d="M840 340 V420" class="flow"/><path d="M980 267 H1230" class="flow"/><path d="M950 340 V390 H1665 V410" class="flow"/><path d="M1795 475 H1910" class="flow"/><path d="M2050 410 V315 H1500" class="flow"/><path d="M2050 570 V620 H1120 V530 H1020" class="flow"/><path d="M290 938 H370" class="flow"/><path d="M290 1117 H370" class="flow"/><path d="M615 940 H660 V927 H720" class="flow"/><path d="M615 1020 H680 V1097 H720" class="flow"/><path d="M615 1105 H660 V1267 H720" class="flow"/><path d="M955 927 H1005 V1075 H1110" class="flow"/><path d="M955 1097 H1110" class="flow"/><path d="M955 1267 H1060 V1150 H1110" class="flow"/><path d="M615 965 H650 V840 H1615 V930 H1670" class="proposalFlow"/><path d="M1670 1000 H1510 V1125 H1380" class="proposalFlow"/><rect x="70" y="205" width="210" height="135" rx="12" class="box"/><text x="175" y="239" class="text" text-anchor="middle"><tspan x="175" dy="0">Candidate / Recruiter</tspan><tspan x="175" dy="24">browser user</tspan><tspan x="175" dy="24">JWT application session</tspan></text><rect x="365" y="190" width="245" height="150" rx="14" class="cloud"/><text x="487" y="224" class="small" text-anchor="middle"><tspan x="487" dy="0">React frontend</tspan><tspan x="487" dy="25">Cloud Run: resume-ip-frontend</tspan><tspan x="487" dy="25">static Vite bundle</tspan><tspan x="487" dy="25">live VITE_API_BASE_URL unknown</tspan></text><rect x="700" y="190" width="280" height="150" rx="14" class="cloud"/><text x="840" y="222" class="small" text-anchor="middle"><tspan x="840" dy="0">FastAPI API</tspan><tspan x="840" dy="23">Cloud Run: resume-ip-api</tspan><tspan x="840" dy="23">JWT/RBAC • postings • uploads</tspan><tspan x="840" dy="23">platform port not verified</tspan><tspan x="840" dy="23">deployed Neon branch UNKNOWN</tspan></text><rect x="720" y="420" width="300" height="140" rx="14" class="cloud"/><text x="870" y="453" class="small" text-anchor="middle"><tspan x="870" dy="0">Neon PostgreSQL</tspan><tspan x="870" dy="24">AWS Singapore • pooled endpoint</tspan><tspan x="870" dy="24">host / connection details masked</tspan><tspan x="870" dy="24">DA1 deployed branch UNKNOWN</tspan></text><rect x="1230" y="195" width="270" height="145" rx="14" class="cloud"/><text x="1365" y="230" class="small" text-anchor="middle"><tspan x="1365" dy="0">Cloud Storage</tspan><tspan x="1365" dy="25">private resume PDFs</tspan><tspan x="1365" dy="25">API upload / worker download</tspan><tspan x="1365" dy="25">managed service</tspan></text><rect x="1535" y="410" width="260" height="130" rx="14" class="cloud"/><text x="1665" y="443" class="small" text-anchor="middle"><tspan x="1665" dy="0">Pub/Sub</tspan><tspan x="1665" dy="23">topic: resume.uploaded</tspan><tspan x="1665" dy="23">asynchronous event</tspan><tspan x="1665" dy="23">API publishes after successful upload</tspan></text><rect x="1910" y="410" width="300" height="160" rx="14" class="cloud"/><text x="2060" y="444" class="small" text-anchor="middle"><tspan x="2060" dy="0">Resume worker</tspan><tspan x="2060" dy="24">Cloud Run: resume-ip-worker</tspan><tspan x="2060" dy="24">extract → skill match → score</tspan><tspan x="2060" dy="24">authenticated push delivery</tspan><tspan x="2060" dy="24">platform port not verified</tspan></text><rect x="70" y="575" width="300" height="78" rx="10" class="tool"/><text x="220" y="606" class="small" text-anchor="middle"><tspan x="220" dy="0">IAM + scoped service accounts</tspan><tspan x="220" dy="23">least-privilege cloud-resource access</tspan></text><rect x="405" y="575" width="230" height="78" rx="10" class="tool"/><text x="520" y="606" class="small" text-anchor="middle"><tspan x="520" dy="0">Cloud Logging</tspan><tspan x="520" dy="23">DA1 observability</tspan></text><text x="700" y="642" class="text" text-anchor="start">Cloud SQL (DA1) suspended, migrated to Neon — historical database, not active request path.</text><text x="700" y="675" class="note" text-anchor="start">IAM and Logging are cross-cutting support; they are not sequential request-path components.</text><text x="322" y="245" class="small" text-anchor="middle">HTTPS</text><text x="655" y="245" class="small" text-anchor="middle">HTTPS API</text><text x="850" y="374" class="small" text-anchor="start">SQLAlchemy → pooled DB</text><text x="1105" y="245" class="small" text-anchor="middle">PDF upload / object metadata</text><text x="1305" y="363" class="small" text-anchor="middle">API publishes resume.uploaded after successful upload</text><text x="1852" y="458" class="small" text-anchor="middle">push delivery</text><text x="1750" y="292" class="small" text-anchor="middle">worker downloads PDF</text><text x="1530" y="605" class="small" text-anchor="middle">worker persists status, score and matched skills</text><rect x="70" y="870" width="220" height="135" rx="12" class="tool"/><text x="180" y="904" class="small" text-anchor="middle"><tspan x="180" dy="0">Apache Bench</tspan><tspan x="180" dy="24">Step 11: GET /postings</tspan><tspan x="180" dy="24">1,000 measured requests</tspan><tspan x="180" dy="24">targets localhost:8080</tspan></text><rect x="70" y="1050" width="220" height="130" rx="12" class="tool"/><text x="180" y="1084" class="small" text-anchor="middle"><tspan x="180" dy="0">Availability probe</tspan><tspan x="180" dy="24">GET /health</tspan><tspan x="180" dy="24">samples about every 200 ms</tspan><tspan x="180" dy="24">targets localhost:8080</tspan></text><rect x="370" y="910" width="245" height="220" rx="12" class="box"/><text x="492" y="946" class="small" text-anchor="middle"><tspan x="492" dy="0">Nginx</tspan><tspan x="492" dy="25">host :8080 → container :80</tspan><tspan x="492" dy="25">round-robin upstream</tspan><tspan x="492" dy="25">64 KiB shared zone</tspan><tspan x="492" dy="25">HTTP/1.1; forwards Host</tspan><tspan x="492" dy="25">no max_conns / no backup</tspan><tspan x="492" dy="25">nginx:stable-alpine (mutable)</tspan></text><rect x="720" y="860" width="235" height="135" rx="12" class="box"/><text x="837" y="895" class="small" text-anchor="middle"><tspan x="837" dy="0">backend-1</tspan><tspan x="837" dy="24">FastAPI / Uvicorn</tspan><tspan x="837" dy="24">host :8001 → container :8000</tspan><tspan x="837" dy="24">one worker • 0.5 CPU • 512 MiB</tspan></text><rect x="720" y="1030" width="235" height="135" rx="12" class="box"/><text x="837" y="1065" class="small" text-anchor="middle"><tspan x="837" dy="0">backend-2</tspan><tspan x="837" dy="24">FastAPI / Uvicorn</tspan><tspan x="837" dy="24">host :8002 → container :8000</tspan><tspan x="837" dy="24">one worker • 0.5 CPU • 512 MiB</tspan></text><rect x="720" y="1200" width="235" height="135" rx="12" class="box"/><text x="837" y="1235" class="small" text-anchor="middle"><tspan x="837" dy="0">backend-3</tspan><tspan x="837" dy="24">FastAPI / Uvicorn</tspan><tspan x="837" dy="24">host :8003 → container :8000</tspan><tspan x="837" dy="24">one worker • 0.5 CPU • 512 MiB</tspan></text><rect x="1110" y="1025" width="270" height="180" rx="14" class="cloud"/><text x="1245" y="1060" class="small" text-anchor="middle"><tspan x="1245" dy="0">Neon PostgreSQL</tspan><tspan x="1245" dy="25">AWS Singapore • pooled endpoint</tspan><tspan x="1245" dy="25">DA3 branch: da3-loadtest</tspan><tspan x="1245" dy="25">host masked; capacity unverified</tspan><tspan x="1245" dy="25">shared external dependency</tspan></text><rect x="370" y="1220" width="245" height="80" rx="10" class="tool"/><text x="492" y="1252" class="small" text-anchor="middle"><tspan x="492" dy="0">Docker Compose</tspan><tspan x="492" dy="23">manages local DA3 stack</tspan></text><rect x="1110" y="1240" width="270" height="80" rx="10" class="tool"/><text x="1245" y="1272" class="small" text-anchor="middle"><tspan x="1245" dy="0">Alembic</tspan><tspan x="1245" dy="23">migration tool; not request path</tspan></text><text x="65" y="1390" class="note" text-anchor="start">Step 11 median: 24.88 requests/s across three local backends. Each backend connects to the shared pooled Neon endpoint.</text><text x="492" y="1162" class="small" text-anchor="middle">HTTP/1.1 upstream to each container :8000</text><rect x="1670" y="895" width="625" height="180" rx="14" class="proposal"/><text x="1982" y="927" class="proposalText" text-anchor="middle"><tspan x="1982" dy="0">Proposed Cloud Run burst API service</tspan><tspan x="1982" dy="24">same stateless FastAPI backend image</tspan><tspan x="1982" dy="24">maximum 6 burst instances proposed</tspan><tspan x="1982" dy="24">intended shared DA3 Neon pooled endpoint</tspan><tspan x="1982" dy="24">URL, max_conns, HTTPS/SNI/Host, ingress</tspan><tspan x="1982" dy="24">and Neon connection budget not verified</tspan></text><rect x="1515" y="1170" width="825" height="220" rx="14" class="proposal"/><text x="1540" y="1205" class="proposalLabel" text-anchor="start">Illustrative capacity arithmetic — not tested capacity</text><text x="1540" y="1235" class="proposalText" text-anchor="start"><tspan x="1540" dy="0">40,000 reads / 600 s = 66.67 ≈ 67 assumed read requests/s</tspan><tspan x="1540" dy="25">44,000 total HTTP requests / 600 s = 73.33 total requests/s</tspan><tspan x="1540" dy="25">24.88 / 3 = 8.2933 ≈ 8.3 illustrative requests/s per backend</tspan><tspan x="1540" dy="25">ceil(67 / (24.88 / 3)) = ceil(8.08) = 9 total instances</tspan><tspan x="1540" dy="25">9 total − 3 local = 6 additional burst instances</tspan><tspan x="1540" dy="25">ceil(73.33 / (24.88 / 3)) = ceil(8.84) = 9 total instances</tspan></text><text x="1515" y="1410" class="proposalText" text-anchor="start">Linear scaling, Nginx saturation hand-off and sufficient Neon capacity remain unverified.</text><text x="65" y="1488" class="section" text-anchor="start">Legend and evidence boundary</text><path d="M75 1524 H155" class="flow"/><text x="175" y="1530" class="text" text-anchor="start">black solid = existing/built component or documented flow</text><path d="M730 1524 H810" class="proposalFlow"/><text x="830" y="1530" class="proposalText" text-anchor="start">orange dashed = Proposed, not built</text><text x="65" y="1565" class="small" text-anchor="start">Demand rates are Step 7 assumptions, not observed production traffic. The 24.88 requests/s result is a local Compose measurement, not Cloud Run performance.</text><text x="65" y="1588" class="small" text-anchor="start">No DA1 live API URL, deployed database branch, burst service URL, endpoint host, or secret value is shown.</text></svg>