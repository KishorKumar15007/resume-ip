log_format da3_json escape=json '{"time":"$time_iso8601","pid":$pid,"connection":$connection,"connection_requests":$connection_requests,"remote_addr":"$remote_addr","request":"$request","status":$status,"request_time":"$request_time","upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time"}';

access_log /dev/stdout da3_json;
access_log /var/log/nginx/da3-access.log da3_json;
error_log /dev/stderr warn;

upstream resume_ip_backends {
    zone resume_ip_backends 64k;
    server backend-1:8000 max_fails=2 fail_timeout=10s;
    server backend-2:8000 max_fails=2 fail_timeout=10s;
    server backend-3:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://resume_ip_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
        proxy_connect_timeout 1s;
    }
}
