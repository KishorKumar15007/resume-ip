x-backend-common: &backend-common
  build:
    context: ./backend
    target: api
  command: [ "sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port \"$${PORT}\" --workers 1" ]
  env_file:
    - "${DA3_LOADTEST_ENV_FILE:?Set DA3_LOADTEST_ENV_FILE to the owner-managed load-test configuration path}"
  environment:
    PORT: "8000"
  expose:
    - "8000"
  cpus: "${BACKEND_CPUS:-0.5}"
  mem_limit: "${BACKEND_MEMORY:-512m}"
  healthcheck:
    test: [ "CMD", "python", "-c", "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/health', timeout=2); assert response.status == 200" ]
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 20s

services:
  backend-1:
    <<: *backend-common
    ports:
      - "8001:8000"
    environment:
      DB_LIFECYCLE_TRACE: "${DB_LIFECYCLE_TRACE:-0}"
      PORT: "8000"
      INSTANCE_NAME: backend-1

  backend-2:
    <<: *backend-common
    ports:
      - "8002:8000"
    environment:
      DB_LIFECYCLE_TRACE: "${DB_LIFECYCLE_TRACE:-0}"
      PORT: "8000"
      INSTANCE_NAME: backend-2

  backend-3:
    <<: *backend-common
    ports:
      - "8003:8000"
    environment:
      DB_LIFECYCLE_TRACE: "${DB_LIFECYCLE_TRACE:-0}"
      PORT: "8000"
      INSTANCE_NAME: backend-3

  nginx:
    image: nginx:stable-alpine
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx-3.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./docs/da3/results/nginx-logs:/var/log/nginx

  loadtest:
    build:
      context: .
      dockerfile: Dockerfile.loadtest
    profiles:
      - loadtest
    depends_on:
      nginx:
        condition: service_started
    command: [ "-V" ]
